<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Red+Rose:wght@300..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="main">
        <div class="display"></div>
        <div class="firstRow">
            <button class="button7">7</button>
            <button class="button8">8</button>
            <button class="button9">9</button>
            <button class="division">÷</button>
        </div>
        <div class="secondRow">
            <button class="button4">4</button>
            <button class="button5">5</button>
            <button class="button6">6</button>
            <button class="multiplication">×</button>
        </div>
        <div class="thirdRow">
            <button class="button1">1</button>
            <button class="button2">2</button>
            <button class="button3">3</button>
            <button class="substraction">-</button>
        </div>
        <div class="fourthRow">
            <button class="button0">0</button>
            <button class="buttonDot">.</button>
            <button class="equal">=</button>
            <button class="addition">+</button>
        </div>
    </div>







    <script src="script.js"></script>
</body>
</html>
